

sprint.application.name=gabicake-backend

# Conexao com o banco vem do docker-compose (SPRING_DATASOURCE_*).
# As tabelas sao criadas pelo schema.sql; o Hibernate so valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Expoe /actuator/health
management.endpoints.web.exposure.include=health
