server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gabicake}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gabicake}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:troque_esta_senha}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hash de senha: custo (work factor) do BCrypt. 10 é o mesmo do seed (gen_salt('bf', 10)).
# Aumentar deixa o login mais lento e o hash mais difícil de quebrar; hashes antigos são atualizados no próximo login.
app.security.bcrypt-strength=${BCRYPT_STRENGTH:10}